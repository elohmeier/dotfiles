[project]
name = "ennos-dotfiles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Enno Richter", email = "enno@nerdworks.de" }]
requires-python = ">=3.12"
dependencies = [
  "rich",
  "rich-click",
  "click",
  "httpx",
  "questionary",
  "PyYAML",
  "requests",
  "flask",
  "waitress",
  "pydantic-settings",
  "pillow",
  "watchdog",
]

[project.scripts]
ghq-glab-cloneall = "scripts.ghq_glab_cloneall:main"
ghq-bitbucket-cloneall = "scripts.ghq_bitbucket_cloneall:main"
backup-pg = "scripts.backup_pg:cli"
ocauth = "scripts.ocauth:main"
httpserve = "scripts.httpserve:main"
chrome-profile-manager = "scripts.chrome_profile_manager:main"
compress-dir = "scripts.compress_dir:main"
git-remote-ssh = "scripts.git_remote_ssh:main"
cyberark-psm = "scripts.cyberark_psm:main"
grafana-users = "scripts.grafana_users:main"
grafana-dashboard-viewer = "scripts.grafana_dashboard_viewer:main"
grafana-query = "scripts.grafana_query:main"
metrics-scout = "scripts.metrics_scout:main"
git-survey = "scripts.git_survey:main"
typst-watch = "scripts.typst_watch:main"
foreman-job = "scripts.foreman_job:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scripts"
module-root = ""

[dependency-groups]
dev = [
  "ruff>=0.15.12",
  "ty>=0.0.34",
]
