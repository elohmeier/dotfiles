repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-jsonschema
        name: Validate pre-commit configuration
        args:
          - "--schemafile"
          - "https://json.schemastore.org/pre-commit-config.json"
        files: ^\.pre-commit-config\.yaml$
  - repo: local
    hooks:
      - id: ruff
        name: Check and fix Python code with Ruff
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
        stages: [pre-push]
      - id: ruff-format
        name: Format Python code with Ruff
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: dprint
        name: Format files with dprint
        entry: dprint fmt --allow-no-files
        language: system
        pass_filenames: false
        files: \.(json|md|toml|yaml|yml|ts|tsx)$
      - id: stylua
        name: Format Lua files with stylua
        entry: stylua
        language: system
        types: [lua]
        files: ^home/dot_config/nvim/
      - id: shfmt
        name: Format shell scripts with shfmt
        entry: shfmt -w
        language: system
        types: [shell]
        files: ^home/\.chezmoiscripts/
        stages: [pre-push]
      - id: shellcheck
        name: Lint shell scripts with shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        files: ^home/\.chezmoiscripts/
        stages: [pre-push]
      - id: ty
        name: Type-check Python code with ty
        entry: uv run --locked ty check scripts
        language: system
        pass_filenames: false
        files: .*\.py$
        stages: [pre-push]
