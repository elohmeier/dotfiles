repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        name: Check and fix Python code with Ruff
        args: [--fix, --exit-zero]
        files: .*\.py$
        stages: [pre-push]
      - id: ruff-format
        name: Format Python code with Ruff
        files: .*\.py$
  - repo: local
    hooks:
      - id: dprint
        name: Format files with dprint
        entry: dprint fmt --allow-no-files
        language: system
        pass_filenames: false
        files: \.(json|md|toml|yaml|yml)$
      - id: stylua
        name: Format Lua files with stylua
        entry: stylua
        language: system
        types: [lua]
        files: ^home/dot_config/nvim/
